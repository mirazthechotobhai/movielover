<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function() {
        try {
          var _rawFetch = typeof window !== 'undefined' ? window.fetch : null;
          var _activeFetch = _rawFetch;

          var descriptor = {
            get: function() {
              return _activeFetch || (typeof window !== 'undefined' ? window.fetch : undefined);
            },
            set: function(fn) {
              _activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e) {}
          }
        } catch (err) {}

        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
              e.preventDefault();
              if (e.stopImmediatePropagation) {
                e.stopImmediatePropagation();
              } else if (e.stopPropagation) {
                e.stopPropagation();
              }
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason && e.reason.message && e.reason.message.indexOf('fetch') !== -1 && e.reason.message.indexOf('getter') !== -1) {
              e.preventDefault();
            }
          });
        }
      })();
    </script>
    <title>StreamCast - Remote Control</title>
    <meta name="description" content="Mobile Remote Control for StreamCast" />
    <meta property="og:title" content="StreamCast - Remote Control" />
    <meta property="og:description" content="Mobile Remote Control for StreamCast" />
    <meta name="theme-color" content="#0f0f13" />
  </head>
  <body class="bg-[#0f0f13] text-white m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
